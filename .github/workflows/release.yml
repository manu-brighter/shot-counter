name: Release

# Build desktop artifacts for Windows + Linux and publish them to a GitHub
# Release. Triggered by pushing a version tag (e.g. v1.0.0); also runnable
# manually from the Actions tab.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write # electron-builder needs this to create the release + upload assets

# max-parallel below only serialises the matrix within one run; this stops two
# runs (e.g. a re-pushed tag) from publishing into the same release at once.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    strategy:
      # Run one runner at a time so both jobs publish into the same release
      # instead of racing to create it.
      max-parallel: 1
      matrix:
        include:
          - os: windows-latest
            platform: --win
          - os: ubuntu-latest
            platform: --linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # electron-builder names the release after package.json, not the tag —
      # without this a forgotten version bump silently produces a mislabelled
      # release.
      - name: Verify tag matches package.json version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      # postinstall runs `electron-builder install-app-deps`, which pulls the
      # prebuilt better-sqlite3 binary for this runner's platform (Electron 42 /
      # ABI v146) — no C++ compiler needed.
      - run: npm ci

      - run: npm run build

      - name: Build & publish
        run: npx electron-builder ${{ matrix.platform }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
