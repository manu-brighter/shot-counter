name: Release

# Build desktop artifacts for Windows + Linux and publish them to a GitHub
# Release. Triggered by pushing a version tag (e.g. v1.0.0); also runnable
# manually from the Actions tab.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write # the publish job needs this to create the release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Build only — electron-builder must NOT publish here. It uploads artifacts
  # in parallel, and each upload independently asks "does the release exist
  # yet?"; concurrent uploads all get "no" and each creates its own release,
  # scattering the assets across duplicate drafts. Building to disk and
  # releasing once, from a single job below, avoids that entirely.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: --win
          - os: ubuntu-latest
            platform: --linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      # electron-builder names the release after package.json, not the tag —
      # without this a forgotten version bump silently produces a mislabelled
      # release.
      - name: Verify tag matches package.json version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      # postinstall runs `electron-builder install-app-deps`, which pulls the
      # prebuilt better-sqlite3 binary for this runner's platform (Electron 42 /
      # ABI v146) — no C++ compiler needed.
      - run: npm ci

      - run: npm run build

      - name: Build desktop artifacts
        run: npx electron-builder ${{ matrix.platform }} --publish never

      # Only the files the README links to. The .blockmap and latest*.yml that
      # electron-builder emits are for electron-updater, which this app does
      # not use.
      - uses: actions/upload-artifact@v6
        with:
          name: dist-${{ matrix.os }}
          retention-days: 1
          if-no-files-found: error
          path: |
            dist-electron/*.exe
            dist-electron/*.AppImage

  # One job, one release, all assets.
  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts

      # Draft: the artifacts are reviewed before anyone can download them.
      # Deliberately not --prerelease even for beta versions — GitHub excludes
      # pre-releases from /releases/latest/, which is what the README links use.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --draft \
            --generate-notes \
            artifacts/*
